name: Build Vicalox Ruffle

on:
  push:
    paths:
      - 'vicalox-ruffle/**'
      - '.github/workflows/build-vicalox-ruffle.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Ruffle 0.5.0 source
        run: |
          git clone https://github.com/ruffle-rs/ruffle.git ruffle-src
          cd ruffle-src
          git checkout a4f5b5256e245693bc9077ef6c6b6abc95490e7f

      - name: Apply Vicalox Worker compatibility
        run: |
          cp vicalox-ruffle/Worker.as ruffle-src/core/src/avm2/globals/flash/system/Worker.as
          cp vicalox-ruffle/WorkerDomain.as ruffle-src/core/src/avm2/globals/flash/system/WorkerDomain.as
          echo 'Applied Vicalox cooperative Worker runtime'

      - name: Apply Vicalox AGAL2 Stage3D limits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          builder = Path('ruffle-src/render/naga-agal/src/builder.rs')
          text = builder.read_text()
          old = '''const VERTEX_PROGRAM_CONSTANTS: u64 = 128;\nconst FRAGMENT_PROGRAM_CONSTANTS: u64 = 28;'''
          new = '''// Vicalox: full AGAL2 register space.\nconst VERTEX_PROGRAM_CONSTANTS: u64 = 250;\nconst FRAGMENT_PROGRAM_CONSTANTS: u64 = 64;'''
          if old not in text:
              raise SystemExit('builder.rs constant block not found')
          builder.write_text(text.replace(old, new, 1))

          pipeline = Path('ruffle-src/render/wgpu/src/context3d/current_pipeline.rs')
          text = pipeline.read_text()
          old = '''const AGAL_NUM_VERTEX_CONSTANTS: u64 = 128;\nconst AGAL_NUM_FRAGMENT_CONSTANTS: u64 = 28;'''
          new = '''// Vicalox: full AGAL2 constant buffers.\nconst AGAL_NUM_VERTEX_CONSTANTS: u64 = 250;\nconst AGAL_NUM_FRAGMENT_CONSTANTS: u64 = 64;'''
          if old not in text:
              raise SystemExit('current_pipeline.rs constant block not found')
          pipeline.write_text(text.replace(old, new, 1))
          print('Applied AGAL2 constants: vertex=250 fragment=64')
          PY

      - name: Apply Vicalox Flash API compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          matrix = Path('ruffle-src/core/src/avm2/globals/flash/geom/Matrix3D.as')
          text = matrix.read_text()
          if 'function interpolateTo(' not in text:
              anchor = '        public function append(lhs:Matrix3D):void {'
              method = '''        // Vicalox/Flare3D compatibility.\n        public function interpolateTo(toMat:Matrix3D, percent:Number):void {\n            if (toMat == null) {\n                throw new TypeError("Error #2007: Parameter toMat must be non-null.", 2007);\n            }\n            for (var i:int = 0; i < 16; i++) {\n                this._rawData[i] = this._rawData[i] + (toMat._rawData[i] - this._rawData[i]) * percent;\n            }\n        }\n\n        public static function interpolate(thisMat:Matrix3D, toMat:Matrix3D, percent:Number):Matrix3D {\n            if (thisMat == null || toMat == null) {\n                throw new TypeError("Error #2007: Parameter must be non-null.", 2007);\n            }\n            var out:Matrix3D = new Matrix3D(thisMat._rawData);\n            out.interpolateTo(toMat, percent);\n            return out;\n        }\n\n'''
              if anchor not in text:
                  raise SystemExit('Matrix3D append anchor not found')
              matrix.write_text(text.replace(anchor, method + anchor, 1))

          tb = Path('ruffle-src/core/src/avm2/globals/flash/text/engine/TextBlock.as')
          text = tb.read_text()
          if 'function releaseLineCreationData(' not in text:
              anchor = '        public function releaseLines(start:TextLine, end:TextLine):void {'
              method = '''        public function releaseLineCreationData():void {\n            // Flash releases internal FTE composition caches here. Ruffle does not\n            // retain equivalent creation data, so a no-op matches the observable API.\n        }\n\n'''
              if anchor not in text:
                  raise SystemExit('TextBlock releaseLines anchor not found')
              tb.write_text(text.replace(anchor, method + anchor, 1))
          PY

      - name: Apply Vicalox ATF DXT1 and culling compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------------
          # 1) Parse non-alpha ATF compressed textures used by this Flare3D MU.
          # ------------------------------------------------------------------
          atf = Path('ruffle-src/render/src/atf.rs')
          text = atf.read_text()

          old = '''    CompressedAlpha {\n        jpegxr_alpha: Vec<u8>,\n        dxt1_alpha_compressed: Vec<u8>,\n        jpegxr_bgr: Vec<u8>,\n        dxt5_rgb_compressed: Vec<u8>,\n    },'''
          new = '''    // ATF format 2: the DXT1 selector bits are LZMA-compressed and\n    // the two RGB565 endpoint colors are stored in a JPEG-XR image.\n    Compressed {\n        dxt1_indices_compressed: Vec<u8>,\n        jpegxr_colors: Vec<u8>,\n    },\n    // ATF format 3: raw platform-compressed payloads. We use the DXT1\n    // stream and decode it to RGBA for maximum WebGL compatibility.\n    CompressedRaw {\n        dxt1: Vec<u8>,\n    },\n    CompressedAlpha {\n        jpegxr_alpha: Vec<u8>,\n        dxt1_alpha_compressed: Vec<u8>,\n        jpegxr_bgr: Vec<u8>,\n        dxt5_rgb_compressed: Vec<u8>,\n    },'''
          if old not in text:
              raise SystemExit('ATFTextureData enum anchor not found')
          text = text.replace(old, new, 1)

          old = '''                    ATFFormat::CompressedAlpha => {'''
          new = '''                    ATFFormat::Compressed => {\n                        // Adobe ATF compressed RGB layout begins with:\n                        //  1) LZMA-compressed DXT1 2-bit selector data\n                        //  2) JPEG-XR BGR565 endpoint-color image\n                        // Remaining records contain PVRTC/ETC/ETC2 variants;\n                        // they are skipped because the browser path uses DXT1.\n                        let bits_len = read_len(bytes)? as usize;\n                        let mut dxt1_indices_compressed = vec![0; bits_len];\n                        bytes.read_exact(&mut dxt1_indices_compressed)?;\n\n                        let colors_len = read_len(bytes)? as usize;\n                        let mut jpegxr_colors = vec![0; colors_len];\n                        bytes.read_exact(&mut jpegxr_colors)?;\n\n                        // Original ATF v0 has DXT1 + PVRTC + ETC1 = 8 records.\n                        // Extended ATF adds ETC2 = 11 records.\n                        let remaining_records = if version == 0 { 6 } else { 9 };\n                        for _ in 0..remaining_records {\n                            let len = read_len(bytes)? as usize;\n                            *bytes = &bytes[len..];\n                        }\n\n                        face_mip_data[face].push(ATFTextureData::Compressed {\n                            dxt1_indices_compressed,\n                            jpegxr_colors,\n                        });\n                    }\n                    ATFFormat::RawCompressed => {\n                        let dxt1_len = read_len(bytes)? as usize;\n                        let mut dxt1 = vec![0; dxt1_len];\n                        bytes.read_exact(&mut dxt1)?;\n\n                        // PVRTC, ETC1 and ETC2 raw streams are not needed on\n                        // desktop WebGL; consume them to keep the parser aligned.\n                        for _ in 0..3 {\n                            let len = read_len(bytes)? as usize;\n                            *bytes = &bytes[len..];\n                        }\n                        face_mip_data[face].push(ATFTextureData::CompressedRaw { dxt1 });\n                    }\n                    ATFFormat::CompressedAlpha => {'''
          if old not in text:
              raise SystemExit('ATF CompressedAlpha match anchor not found')
          text = text.replace(old, new, 1)

          # The fallback arm must no longer claim formats 2/3.
          text = text.replace(
              '''                            ATFFormat::RawCompressed | ATFFormat::RawCompressedAlpha => 4,\n                            ATFFormat::Compressed => 11,''',
              '''                            ATFFormat::RawCompressedAlpha => 4,''',
              1,
          )
          atf.write_text(text)

          # ------------------------------------------------------------------
          # 2) Reconstruct/decode DXT1 and upload RGBA pixels.
          # ------------------------------------------------------------------
          dec = Path('ruffle-src/core/src/avm2/globals/flash/display3D/textures/atf_jpegxr.rs')
          text = dec.read_text()
          anchor = '''        ATFTextureData::CompressedAlpha {'''
          arm = r'''        ATFTextureData::Compressed {
            dxt1_indices_compressed,
            jpegxr_colors,
        } => {
            let block_x = std::cmp::max(1, atf_texture.width.div_ceil(4));
            let block_y = std::cmp::max(1, atf_texture.height.div_ceil(4));
            let block_count = (block_x * block_y) as usize;

            // ATF's LZMA stream omits the 8-byte uncompressed-length field.
            let mut packed = dxt1_indices_compressed.clone();
            packed.splice(5..5, u64::MAX.to_le_bytes());
            let mut selectors = Vec::with_capacity(block_count * 4);
            lzma_rs::lzma_decompress(&mut packed.as_slice(), &mut selectors)
                .expect("Failed to decompress ATF DXT1 selectors");

            if selectors.len() < block_count * 4 {
                return Err("ATF DXT1 selector stream is too small".into());
            }

            // Encoder stores c0 in the upper image half and c1 in the lower
            // half, as BGR565 JPEG-XR pixels.
            let color_height = std::cmp::max(2, block_y * 2);
            let colors = jpegxr_to_raw_pixels(
                block_x,
                color_height,
                &mut Cursor::new(jpegxr_colors),
            );
            let half_bytes = block_count * 2;
            if colors.len() < half_bytes * 2 {
                return Err("ATF DXT1 color stream is too small".into());
            }

            let mut dxt1 = Vec::with_capacity(block_count * 8);
            for i in 0..block_count {
                dxt1.extend_from_slice(&colors[i * 2..i * 2 + 2]);
                let c1 = half_bytes + i * 2;
                dxt1.extend_from_slice(&colors[c1..c1 + 2]);
                dxt1.extend_from_slice(&selectors[i * 4..i * 4 + 4]);
            }
            decode_dxt1_rgba(&dxt1, atf_texture.width, atf_texture.height)?
        }
        ATFTextureData::CompressedRaw { dxt1 } => {
            decode_dxt1_rgba(dxt1, atf_texture.width, atf_texture.height)?
        }
'''
          if anchor not in text:
              raise SystemExit('atf_jpegxr CompressedAlpha anchor not found')
          text = text.replace(anchor, arm + anchor, 1)

          helper_anchor = '''fn jpegxr_to_raw_pixels<R: Read + Seek>'''
          helper = r'''fn decode_dxt1_rgba(
    dxt1: &[u8],
    width: u32,
    height: u32,
) -> Result<Vec<u8>, Box<dyn std::error::Error>> {
    let blocks_x = std::cmp::max(1, width.div_ceil(4));
    let blocks_y = std::cmp::max(1, height.div_ceil(4));
    let needed = blocks_x as usize * blocks_y as usize * 8;
    if dxt1.len() < needed {
        return Err(format!("DXT1 data too short: {} < {}", dxt1.len(), needed).into());
    }

    let mut out = vec![0u8; width as usize * height as usize * 4];

    fn rgb565(c: u16) -> [u8; 3] {
        let r5 = ((c >> 11) & 0x1f) as u8;
        let g6 = ((c >> 5) & 0x3f) as u8;
        let b5 = (c & 0x1f) as u8;
        [
            (r5 << 3) | (r5 >> 2),
            (g6 << 2) | (g6 >> 4),
            (b5 << 3) | (b5 >> 2),
        ]
    }

    for by in 0..blocks_y {
        for bx in 0..blocks_x {
            let bi = ((by * blocks_x + bx) * 8) as usize;
            let c0 = u16::from_le_bytes([dxt1[bi], dxt1[bi + 1]]);
            let c1 = u16::from_le_bytes([dxt1[bi + 2], dxt1[bi + 3]]);
            let p0 = rgb565(c0);
            let p1 = rgb565(c1);

            let mut palette = [[0u8; 4]; 4];
            palette[0] = [p0[0], p0[1], p0[2], 255];
            palette[1] = [p1[0], p1[1], p1[2], 255];
            if c0 > c1 {
                palette[2] = [
                    ((2 * p0[0] as u16 + p1[0] as u16) / 3) as u8,
                    ((2 * p0[1] as u16 + p1[1] as u16) / 3) as u8,
                    ((2 * p0[2] as u16 + p1[2] as u16) / 3) as u8,
                    255,
                ];
                palette[3] = [
                    ((p0[0] as u16 + 2 * p1[0] as u16) / 3) as u8,
                    ((p0[1] as u16 + 2 * p1[1] as u16) / 3) as u8,
                    ((p0[2] as u16 + 2 * p1[2] as u16) / 3) as u8,
                    255,
                ];
            } else {
                palette[2] = [
                    ((p0[0] as u16 + p1[0] as u16) / 2) as u8,
                    ((p0[1] as u16 + p1[1] as u16) / 2) as u8,
                    ((p0[2] as u16 + p1[2] as u16) / 2) as u8,
                    255,
                ];
                palette[3] = [0, 0, 0, 0];
            }

            let lookup = u32::from_le_bytes([
                dxt1[bi + 4],
                dxt1[bi + 5],
                dxt1[bi + 6],
                dxt1[bi + 7],
            ]);

            for py in 0..4u32 {
                for px in 0..4u32 {
                    let x = bx * 4 + px;
                    let y = by * 4 + py;
                    if x >= width || y >= height {
                        continue;
                    }
                    let pi = ((lookup >> (2 * (py * 4 + px))) & 3) as usize;
                    let dst = ((y * width + x) * 4) as usize;
                    out[dst..dst + 4].copy_from_slice(&palette[pi]);
                }
            }
        }
    }
    Ok(out)
}

'''
          if helper_anchor not in text:
              raise SystemExit('jpegxr helper anchor not found')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)
          dec.write_text(text)

          # ------------------------------------------------------------------
          # 3) Let Texture.uploadCompressedTextureFromByteArray accept the
          #    regular COMPRESSED format, not only COMPRESSED_ALPHA/BGRA.
          # ------------------------------------------------------------------
          tex = Path('ruffle-src/core/src/avm2/globals/flash/display3D/textures/texture.rs')
          text = tex.read_text()
          old = '''        Context3DTextureFormat::Bgra | Context3DTextureFormat::CompressedAlpha'''
          new = '''        Context3DTextureFormat::Bgra\n            | Context3DTextureFormat::Compressed\n            | Context3DTextureFormat::CompressedAlpha'''
          if old not in text:
              raise SystemExit('texture compressed format gate not found')
          tex.write_text(text.replace(old, new, 1))

          # Remove the now-obsolete createTexture(COMPRESSED) stub warning.
          obj = Path('ruffle-src/core/src/avm2/object/context3d_object.rs')
          text = obj.read_text()
          block = '''        Context3DTextureFormat::Compressed => {\n            avm2_stub_method!(\n                activation,\n                "flash.display3D.Context3D",\n                "createTexture",\n                "with Compressed"\n            );\n        }\n'''
          if block in text:
              text = text.replace(block, '', 1)
          obj.write_text(text)

          # ------------------------------------------------------------------
          # 4) Flash FRONT_AND_BACK culling means draw no triangles. WGPU has
          #    only front/back single-face culling, so emulate it by submitting
          #    an empty indexed range instead of incorrectly rendering both.
          # ------------------------------------------------------------------
          pipeline = Path('ruffle-src/render/wgpu/src/context3d/current_pipeline.rs')
          text = pipeline.read_text()
          old = '''            Context3DTriangleFace::FrontAndBack => {\n                tracing::error!("FrontAndBack culling not supported!");\n                None\n            }'''
          new = '''            // FRONT_AND_BACK is emulated in drawTriangles by drawing an\n            // empty index range. Keep the pipeline itself uncullled here.\n            Context3DTriangleFace::FrontAndBack => None'''
          if old not in text:
              raise SystemExit('FrontAndBack cull block not found')
          text = text.replace(old, new, 1)

          # Add a tiny state query used by the draw command.
          anchor = '''    pub fn new(descriptors: &Descriptors) -> Self {'''
          method = '''    pub fn culls_all_triangles(&self) -> bool {\n        self.culling == Context3DTriangleFace::FrontAndBack\n    }\n\n'''
          if method.strip() not in text:
              if anchor not in text:
                  raise SystemExit('CurrentPipeline new anchor not found')
              text = text.replace(anchor, method + anchor, 1)
          pipeline.write_text(text)

          ctx = Path('ruffle-src/render/wgpu/src/context3d/mod.rs')
          text = ctx.read_text()
          old = '''                let indices =\n                    (first_index as u32)..((first_index as u32) + (num_triangles as u32 * 3));'''
          new = '''                let indices = if self.current_pipeline.culls_all_triangles() {\n                    // Context3DTriangleFace.FRONT_AND_BACK culls every primitive.\n                    0..0\n                } else {\n                    (first_index as u32)..((first_index as u32) + (num_triangles as u32 * 3))\n                };'''
          if old not in text:
              raise SystemExit('DrawTriangles indices anchor not found')
          ctx.write_text(text.replace(old, new, 1))

          print('Applied Vicalox ATF DXT1 decompression + FrontAndBack culling')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ruffle-src/web/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruffle-src

      - name: Install wasm-bindgen
        run: cargo install --locked wasm-bindgen-cli --version 0.2.120

      - name: Build self-hosted Vicalox Ruffle
        working-directory: ruffle-src/web
        env:
          CARGO_FLAGS: --all-features
        run: |
          npm ci
          npm run build --workspace=ruffle-core
          npm run build --workspace=ruffle-selfhosted

      - name: Verify output
        run: |
          test -f ruffle-src/web/packages/selfhosted/dist/ruffle.js
          find ruffle-src/web/packages/selfhosted/dist -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Upload Vicalox Ruffle
        uses: actions/upload-artifact@v4
        with:
          name: VicaloxRuffle-V10-Textures
          path: ruffle-src/web/packages/selfhosted/dist
          if-no-files-found: error
